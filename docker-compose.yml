services:
  watchlist2dvr:
    image: irizzu/watchlist2dvr:latest
    pull_policy: always
    restart: unless-stopped
    dns:
      - 100.100.100.100  # Tailscale MagicDNS — resolves .ts.net hostnames and peer names
      - 1.1.1.1          # Fallback for public DNS (Tailscale resolver may not forward all queries)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
